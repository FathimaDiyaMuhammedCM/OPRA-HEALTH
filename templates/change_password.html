{% extends 'adminhome.html' %}
{% block body %}
<style>
    body {
        background-color: #f8f9fa;
    }
    .change-password-container {
        margin-top: 100px; /* distance from navbar */
        display: flex;
        justify-content: center;
        align-items: center;
    }
    .change-password-card {
        background: #ffffff;
        padding: 40px;
        border-radius: 15px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 450px;
    }
    .change-password-card h2 {
        text-align: center;
        margin-bottom: 25px;
        color: #007bff;
        font-weight: bold;
    }
    .btn-info {
        background-color: #007bff;
        border: none;
        border-radius: 25px;
        padding: 10px;
        font-size: 16px;
    }
    .btn-info:hover {
        background-color: #0056b3;
    }
    .error-msg {
        color: red;
        font-size: 0.875rem;
        margin-top: 5px;
        display: none;
    }
</style>

<div class="container change-password-container">
    <div class="change-password-card">
        <h2>Change Password</h2>
        <form id="changePasswordForm" method="post" action="/myapp/admin_change_password_post/">
            {% csrf_token %}
            <div class="form-group mb-3">
                <label for="current_password">Current Password</label>
                <input type="password" class="form-control" id="current_password" name="current_password" placeholder="Enter current password" required>
            </div>

            <div class="form-group mb-3">
                <label for="new_password">New Password</label>
                <input type="password" class="form-control" id="new_password" name="new_password" placeholder="Enter new password" required>
                <div id="newPasswordError" class="error-msg">Password must be at least 8 characters, include 1 uppercase letter and 1 number.</div>
            </div>

            <div class="form-group mb-4">
                <label for="confirm_password">Confirm Password</label>
                <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="Re-enter new password" required>
                <div id="confirmPasswordError" class="error-msg">Passwords do not match.</div>
            </div>

            <button type="submit" class="btn btn-info btn-block">Submit</button>
        </form>
         <span style="color: red">
          {% for j in messages %}
          {{ j }}
          {% endfor %}
      </span>
    </div>
</div>


<script>
const newPasswordInput = document.getElementById('new_password');
const confirmPasswordInput = document.getElementById('confirm_password');
const newPasswordError = document.getElementById('newPasswordError');
const confirmPasswordError = document.getElementById('confirmPasswordError');

function validatePassword() {
    const newPassword = newPasswordInput.value;
    const confirmPassword = confirmPasswordInput.value;

    // Password strength check
    const passwordRegex = /^(?=.*[A-Z])(?=.*\d).{8,}$/;
    if (!passwordRegex.test(newPassword)) {
        newPasswordError.style.display = 'block';
    } else {
        newPasswordError.style.display = 'none';
    }

    // Confirm password match check
    if (confirmPassword && newPassword !== confirmPassword) {
        confirmPasswordError.style.display = 'block';
    } else {
        confirmPasswordError.style.display = 'none';
    }
}

// Run validation on input
newPasswordInput.addEventListener('input', validatePassword);
confirmPasswordInput.addEventListener('input', validatePassword);

// Final check on form submission
document.getElementById('changePasswordForm').addEventListener('submit', function(event) {
    const newPassword = newPasswordInput.value;
    const confirmPassword = confirmPasswordInput.value;
    const passwordRegex = /^(?=.*[A-Z])(?=.*\d).{8,}$/;

    let valid = true;

    if (!passwordRegex.test(newPassword)) {
        newPasswordError.style.display = 'block';
        valid = false;
    }

    if (newPassword !== confirmPassword) {
        confirmPasswordError.style.display = 'block';
        valid = false;
    }

    if (!valid) {
        event.preventDefault();
    }
});
</script>
{% endblock %}
