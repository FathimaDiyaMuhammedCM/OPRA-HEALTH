<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Forgot Password</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Poppins', sans-serif;
      color: #333;
    }

    .card {
      background-color: #fff;
      border: none;
      border-radius: 1.2rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
      width: 100%;
      max-width: 450px;
      padding: 2rem;
      transition: all 0.3s ease;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
    }

    h3 {
      font-weight: 600;
      color: #2575fc;
      text-align: center;
      margin-bottom: 1.5rem;
    }

    label {
      font-weight: 500;
    }

    .form-control {
      border-radius: 0.5rem;
      padding: 0.75rem;
    }

    .form-control:focus {
      box-shadow: 0 0 8px rgba(37,117,252,0.5);
      border-color: #2575fc;
    }

    .btn-primary {
      background-color: #2575fc;
      border: none;
      border-radius: 0.5rem;
      padding: 0.75rem;
      width: 100%;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .btn-primary:hover {
      background-color: #1a5fd0;
      transform: scale(1.02);
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 1.2rem;
      color: #2575fc;
      text-decoration: none;
      font-weight: 500;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    .message {
      text-align: center;
      margin-top: 1rem;
      color: #ff3b3b;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="card">
    <h3>Forgot Password</h3>
    <form action="/myapp/and_forget_password_post/" method="post">
      {% csrf_token %}

      <div class="mb-3">
        <label for="textfield" class="form-label">Enter your Email</label>
        <input type="email" class="form-control" id="textfield" name="textfield" placeholder="example@email.com" required>
      </div>

      <button type="submit" class="btn btn-primary">Send Reset Link</button>

      {% for i in messages %}
        <div class="message">{{ i }}</div>
      {% endfor %}
    </form>

    <a href="/myapp/login_get/" class="back-link">← Back to Login</a>
  </div>

  <!-- Bootstrap Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
